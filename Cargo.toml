[package]
name = "waymenu"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A small, keyboard-driven Wayland launcher"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
toml = "0.8.23"
ab_glyph = "0.2.32"
calloop = "0.13.0"
calloop-wayland-source = "0.3.0"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = { version = "0.45.1", default-features = false }
libc = "0.2.191"
smithay-client-toolkit = "0.19.2"
tiny-skia = "0.11.4"
wayland-client = "0.31.12"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"

