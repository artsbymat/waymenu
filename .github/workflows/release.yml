name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
          rustup update stable

      - name: Build Waymenu and test plugins
        run: |
          cargo +stable build --release --locked
          install -Dm755 target/release/waymenu release/waymenu

          for manifest in plugins/*/Cargo.toml; do
            plugin_dir=$(dirname "$manifest")
            plugin=$(basename "$plugin_dir")
            library="lib${plugin//-/_}.so"
            cargo +stable build --release --locked --manifest-path "$manifest"
            cargo +stable test --locked --manifest-path "$manifest"
            install -Dm755 "$plugin_dir/target/release/$library" "release/plugins/$library"
          done

      - name: Test Waymenu workspace
        run: cargo +stable test --locked --workspace

      - name: Package release archive
        run: |
          install -m644 LICENSE release/LICENSE
          tar -C release -czf "waymenu-$GITHUB_REF_NAME-linux-x86_64.tar.gz" .

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            "waymenu-$GITHUB_REF_NAME-linux-x86_64.tar.gz"
